[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "easynovel"
version = "0.2.0"
description = "Local evidence-based AI novel workstation"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "pydantic>=2.9,<3", "httpx>=0.27,<1", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "lancedb>=0.20,<1", "jieba==0.42.1", "keyring>=25,<27", "python-multipart>=0.0.18,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pyinstaller>=6,<7"]
[tool.setuptools.packages.find]
include = ["easynovel*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
