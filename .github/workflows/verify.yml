name: Workstation verification and Windows installer
on: [push, pull_request, workflow_dispatch]
jobs:
  verify-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: python -m venv .venv
      - run: .venv/Scripts/python.exe -m pip install -r requirements.lock.txt
      - run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EasyNovel-Windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
